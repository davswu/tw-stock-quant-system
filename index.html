<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時四指標量化決策系統</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1a1d24;
      --border-red: #e63946;
      --text-main: #f1faee;
      --text-muted: #a8dadc;
      --up-color: #ff4d4d;
      --down-color: #2ec4b6;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-red);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 1.5rem; }
    .price-tag { font-size: 1.8rem; font-weight: bold; color: var(--up-color); }

    /* 4-Card 視覺佈局 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-red);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(230, 57, 70, 0.15);
    }

    .card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: var(--text-muted); }
    .card .value { font-size: 2rem; font-weight: bold; margin-bottom: 8px; }
    .card .delta { font-size: 0.85rem; color: #888; }

    /* 決策訊號卡片 */
    .decision-banner {
      background: var(--card-bg);
      border: 1.5px solid var(--border-red);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signal-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
    }
    .signal-badge.buy { background: var(--up-color); color: #fff; }
    .signal-badge.sell { background: var(--down-color); color: #fff; }
    .signal-badge.neutral { background: #555; color: #fff; }

    /* 歷史決策紀錄表格 */
    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2e39;
    }

    th {
      background: #222630;
      color: var(--text-muted);
      font-weight: 500;
    }

    .price-up { color: var(--up-color); font-weight: bold; }
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .badge.buy { background: rgba(255, 77, 77, 0.2); color: var(--up-color); border: 1px solid var(--up-color); }
    .badge.sell { background: rgba(46, 196, 182, 0.2); color: var(--down-color); border: 1px solid var(--down-color); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="stock-title">8150 南茂 ChipMOS</h1>
      <div id="stock-price" class="price-tag">$112.0</div>
    </header>

    <!-- 4-Card 對數 T-Score 數據卡片 -->
    <div class="cards-grid">
      <div class="card">
        <h3>SDV (價格離差)</h3>
        <div id="sdv-val" class="value">61.5</div>
        <div id="d5-sdv" class="delta">Δ5: +12.4</div>
      </div>
      <div class="card">
        <h3>VDV (量能離差)</h3>
        <div id="vdv-val" class="value">58.4</div>
        <div id="d5-vdv" class="delta">Δ5: +8.2</div>
      </div>
      <div class="card">
        <h3>ADV (波動離差)</h3>
        <div id="adv-val" class="value">62.1</div>
        <div class="delta">張力監控中</div>
      </div>
      <div class="card">
        <h3>BDV (帶寬離差)</h3>
        <div id="bdv-val" class="value">60.8</div>
        <div class="delta">Squeeze 狀態</div>
      </div>
    </div>

    <!-- 即時決策訊號橫幅 -->
    <div class="decision-banner">
      <span>當前系統即時診斷訊號：</span>
      <span id="signal-tag" class="signal-badge buy">二次動能共振突破 (右側加碼)</span>
    </div>

    <!-- 歷史系統決策訊號紀錄表格 (近 6 個月 / 120 交易日) -->
    <div class="section-title">歷史系統決策訊號紀錄 (近 6 個月 / 120 交易日)</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>交易日期</th>
            <th>買入價格</th>
            <th>決策訊號</th>
            <th>交易日期</th>
            <th>賣出價格</th>
            <th>決策訊號</th>
          </tr>
        </thead>
        <tbody id="history-table-body">
          <!-- 由 main.js 動態渲染 -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="quantEngine.js"></script>
  <script src="main.js"></script>
</body>
</html>
