<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四指標趨勢分析與決策系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: #333; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { color: #004080; margin-bottom: 5px; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .card-header .title { font-weight: bold; color: #444; }
    .badge { padding: 4px 8px; border-radius: 4px; color: #fff; font-weight: bold; }
    .card-sub { font-size: 0.85em; color: #666; margin: 8px 0; }
    .delta-pills { display: flex; justify-content: space-between; font-size: 0.8em; background: #f8f9fa; padding: 6px; border-radius: 4px; }
    .risk-card { background: #fff; border-left: 5px solid #f39c12; padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .risk-card h3 { margin-top: 0; color: #f39c12; }
    .new-tag { background: #e74c3c; color: #fff; font-size: 0.6em; padding: 2px 6px; border-radius: 4px; vertical-align: middle; }
    .risk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stop-price { color: #e74c3c; font-weight: bold; font-size: 1.1em; }
    .risk-status-bar { padding: 10px; border-radius: 4px; font-size: 0.9em; }
    .chart-box { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    canvas { width: 100%; height: 300px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 0.9em; }
    th { background: #004080; color: #fff; }
    .signal-badge { padding: 3px 6px; border-radius: 3px; font-size: 0.85em; font-weight: bold; }
    .signal-badge.buy { background: #d4edda; color: #155724; }
    .signal-badge.exit { background: #f8d7da; color: #721c24; }
    .signal-badge.none { background: #e2e3e5; color: #383d41; }
  </style>
</head>
<body>

  <div class="header">
    <h1>四指標趨勢分析與決策系統</h1>
    <p>SDV / VDV / ADV / BDV 狀態機演算與動態風控儀表板</p>
  </div>

  <!-- 1. 頂部四指標矩陣卡片 -->
  <div id="matrix-cards-container" class="grid-container"></div>

  <!-- 2. 第五層風控與倉位管理面板 -->
  <div id="risk-control-panel"></div>

  <!-- 3. K線與動態停損軌跡圖表 -->
  <div class="chart-box">
    <h3 style="text-align:left; margin-top:0; color:#004080;">股價走勢與動態移動停損軌跡 (藍色: 價格 / 紅虛線: 停損價)</h3>
    <canvas id="priceChart" width="1000" height="300"></canvas>
  </div>

  <!-- 4. 歷史紀錄稽核表 -->
  <div style="overflow-x:auto;">
    <h3>歷史決策軌跡 Log (Audit Trail)</h3>
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>收盤價</th>
          <th>SDV / VDV</th>
          <th>ADV / BDV</th>
          <th>決策模式</th>
          <th>動態停損價</th>
          <th>建議倉位</th>
        </tr>
      </thead>
      <tbody id="history-tbody"></tbody>
    </table>
  </div>

  <!-- 引入演算與 UI 控制腳本 -->
  <script src="quantEngine.js"></script>
  <script src="main.js"></script>
</body>
</html>
