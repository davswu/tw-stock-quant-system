<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股實時四指標與決策系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax (可保留用於其他複雜數學公式) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header & 搜尋欄 -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg gap-4">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">台股實時四指標與系統決策矩陣</h1>
                <p class="text-xs text-slate-400 mt-1">對數標準化 (T-Score) + 多週期動能 (Δ₁ / Δ₅ / Δ₁₀) 雙層共振系統</p>
            </div>
            
            <div class="flex items-center space-x-2 w-full md:w-auto">
                <input type="text" id="stockInput" value="2330" placeholder="輸入台股代碼 (如 2330)" 
                       class="bg-slate-900 border border-slate-600 px-4 py-2 rounded-lg text-white font-mono focus:outline-none focus:border-sky-500 w-full md:w-48">
                <button onclick="analyzeStock()" 
                        class="bg-sky-600 hover:bg-sky-500 px-6 py-2 rounded-lg font-bold transition text-white whitespace-nowrap">
                    實時分析
                </button>
            </div>
        </header>

        <!-- 主 Banner：股票資訊與實時決策訊號 -->
        <div id="decisionBanner" class="bg-slate-800 border-l-8 border-sky-500 p-6 rounded-r-xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center space-x-3">
                    <span id="stockTitle" class="text-3xl font-extrabold text-white">2330 --</span>
                    <span id="stockPrice" class="text-2xl font-mono text-emerald-400">NT$ --</span>
                </div>
                <p id="decisionDesc" class="text-sm text-slate-300 mt-2">請點擊實時分析開啟即時數據對接...</p>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 uppercase tracking-wider block">系統決策訊號</span>
                <span id="signalBadge" class="inline-block mt-1 px-4 py-2 rounded-md font-bold text-lg bg-slate-700 text-slate-300">
                    等待分析
                </span>
            </div>
        </div>

        <!-- 四指標 T-Score 現況卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- SDV -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 relative overflow-hidden">
                <div class="text-xs font-bold text-slate-400 mb-1">價格位階 (SDV)</div>
                <div id="sdvValue" class="text-4xl font-extrabold font-mono text-white">--</div>
                <div id="sdvStatus" class="text-xs mt-2 text-slate-400">--</div>
                <div class="absolute top-0 right-0 p-3 opacity-10 text-4xl">📈</div>
            </div>
            
            <!-- VDV -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 relative overflow-hidden">
                <div class="text-xs font-bold text-slate-400 mb-1">資金強度 (VDV)</div>
                <div id="vdvValue" class="text-4xl font-extrabold font-mono text-white">--</div>
                <div id="vdvStatus" class="text-xs mt-2 text-slate-400">--</div>
                <div class="absolute top-0 right-0 p-3 opacity-10 text-4xl">📊</div>
            </div>

            <!-- ADV -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 relative overflow-hidden">
                <div class="text-xs font-bold text-slate-400 mb-1">風險環境 (ADV)</div>
                <div id="advValue" class="text-4xl font-extrabold font-mono text-white">--</div>
                <div id="advStatus" class="text-xs mt-2 text-slate-400">--</div>
                <div class="absolute top-0 right-0 p-3 opacity-10 text-4xl">⚡</div>
            </div>

            <!-- BDV -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 relative overflow-hidden">
                <div class="text-xs font-bold text-slate-400 mb-1">週期張力 (BDV)</div>
                <div id="bdvValue" class="text-4xl font-extrabold font-mono text-white">--</div>
                <div id="bdvStatus" class="text-xs mt-2 text-slate-400">--</div>
                <div class="absolute top-0 right-0 p-3 opacity-10 text-4xl">🎯</div>
            </div>
        </div>

        <!-- 多週期 Δ 動能矩陣區塊 -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                <span>多週期動能矩陣 (Δ₁ / Δ₅ / Δ₁₀)</span>
            </h3>
            
            <div class="overflow-x-auto">
                <table class="w-full text-center text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-400 border-b border-slate-700">
                            <th class="p-3 text-left">指標類型</th>
                            <th class="p-3">當前 T-Score</th>
                            <th class="p-3">Δ₁ (單日動能)</th>
                            <th class="p-3">Δ₅ (短線動能)</th>
                            <th class="p-3">Δ₁₀ (中線結構)</th>
                        </tr>
                    </thead>
                    <tbody id="deltaMatrixBody" class="divide-y divide-slate-700/50 font-mono">
                        <tr><td colspan="5" class="p-4 text-slate-500">尚無資料</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 載入腳本 -->
    <script src="quantEngine.js"></script>
    <script src="main.js"></script>
</body>
</html>
