<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四指標趨勢分析系統 - 完整藍圖架構版</title>
  <style>
    :root {
      --red: #e60000; --green: #008000; --amber: #d97706; --blue: #2563eb;
    }
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .main-container { max-width: 1200px; margin: 0 auto; gap: 20px; display: flex; flex-direction: column; }
    .panel { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    
    /* [1. 頂部檢索區] */
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .status-tag.live { background: #dcfce7; color: var(--green); padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    .status-tag.offline { background: #feef3c; color: #854d0e; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    
    /* [2. 核心概覽卡 & 3. 四指標] */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; }
    .card-indicator { border: 2px solid var(--red); border-radius: 6px; padding: 15px; text-align: center; background: #fff5f5; }
    .card-indicator .val { font-size: 28px; font-weight: bold; color: var(--red); }

    /* [4. ADV 動態風控樞紐 & 5. 多週期動能] */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    table.data-table { width: 100%; border-collapse: collapse; text-align: center; margin-top: 10px; }
    table.data-table th, table.data-table td { border: 1px solid #e5e7eb; padding: 10px; }
    
    /* 四色語意標籤[cite: 2] */
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #fff; font-size: 13px; }
    .badge.red { background-color: var(--red); }
    .badge.green { background-color: var(--green); }
    .badge.amber { background-color: var(--amber); }
    .badge.blue { background-color: var(--blue); }
  </style>
</head>
<body>

<div class="main-container">

  <!-- [1. 頂部檢索區][cite: 2] -->
  <div class="panel top-bar">
    <div>
      <input type="text" id="stock-input" value="8150" style="padding: 6px; font-size: 16px; width: 100px;">
      <button onclick="loadDashboardData(document.getElementById('stock-input').value)" style="padding: 6px 16px;">檢索</button>
    </div>
    <div id="market-status" class="status-tag live">載入中...</div>
  </div>

  <!-- [2. 核心概覽卡][cite: 2] -->
  <div class="panel">
    <h2 id="stock-title" style="margin:0;">--</h2>
    <div id="stock-price" style="font-size: 24px; color: var(--red); font-weight: bold; margin-top: 5px;">--</div>
  </div>

  <!-- [3. 四指標 T-Score 狀態][cite: 2] -->
  <div class="grid-4">
    <div class="card-indicator"><h4>SDV (價)</h4><div class="val" id="sdv-val">--</div></div>
    <div class="card-indicator"><h4>VDV (量)</h4><div class="val" id="vdv-val">--</div></div>
    <div class="card-indicator"><h4>ADV (風)</h4><div class="val" id="adv-val">--</div></div>
    <div class="card-indicator"><h4>BDV (張)</h4><div class="val" id="bdv-val">--</div></div>
  </div>

  <div class="grid-2">
    <!-- [4. ADV 動態風控樞紐][cite: 2] -->
    <div class="panel">
      <h3>[4. ADV 動態風控樞紐]</h3>
      <table class="data-table">
        <tr><th>低波動停損 (1.0 ATR)</th><td id="sl-low">--</td></tr>
        <tr><th>中波動停損 (1.5 ATR)</th><td id="sl-mid">--</td></tr>
        <tr><th>高波動停損 (2.0 ATR)</th><td id="sl-high">--</td></tr>
        <tr><th>噴發拐點停利 (2.5 ATR)</th><td id="tp-target" style="color:var(--red); font-weight:bold;">--</td></tr>
      </table>
    </div>

    <!-- [5. 多週期動能矩陣][cite: 2] -->
    <div class="panel">
      <h3>[5. 多週期動能矩陣]</h3>
      <table class="data-table">
        <tr><th>指標 \ 天期</th><th>1日 (Δ₁)</th><th>5日 (Δ₅)</th><th>10日 (Δ₁₀)</th></tr>
        <tr><td>SDV (股價動能)</td><td id="sdv-d1">--</td><td id="sdv-d5">--</td><td id="sdv-d10">--</td></tr>
        <tr><td>VDV (量能動能)</td><td id="vdv-d1">--</td><td id="vdv-d5">--</td><td id="vdv-d10">--</td></tr>
      </table>
    </div>
  </div>

  <!-- [6. 歷史決策訊號紀錄] (近 120 交易日)[cite: 1, 2] -->
  <div class="panel">
    <h3>[6. 歷史決策訊號紀錄] (近 120 交易日)</h3>
    <table class="data-table">
      <thead>
        <tr style="background:#f8f9fa;">
          <th>交易日期</th><th>買入價格</th><th>決策訊號</th>
          <th>交易日期</th><th>賣出價格</th><th>決策訊號</th>
        </tr>
      </thead>
      <tbody id="history-tbody"></tbody>
    </table>
  </div>

</div>

<script src="quantEngine.js"></script>
<script src="main.js"></script>
</body>
</html>
